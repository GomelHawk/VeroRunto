version: 2

# VeroRunto has no package dependencies - it is one TypeScript hooks module. The only
# thing that can go stale is the actions the CI workflow pins, so that is all this watches.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
